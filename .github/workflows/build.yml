name: Build CZCLIENT

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
          cache-disabled: true
      - name: Verify Gradle version
        run: gradle --version
      - name: Build mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: CZCLIENT-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
